{% extends "global/Page.html" %}
{% load otree %}

{% block title %}
提案額の受け入れ判断
{% endblock %}

{% block content %}
<p>あなたは <b>プレイヤー2</b> に割り振られました。</p>
<p>相手はあなたに <b>{{ group.proposal }}</b> ポイントを提案しました。</p>

<label class="control-label">あなたはこの提案を受け入れますか？</label>

<div class="controls" style="margin-top: 12px;">
  <button type="submit" name="accepted_or_not" value="yes" class="btn btn-primary">
    はい
  </button>
  <button type="submit" name="accepted_or_not" value="no" class="btn btn-secondary">
    いいえ
  </button>
</div>
{% endblock %}
